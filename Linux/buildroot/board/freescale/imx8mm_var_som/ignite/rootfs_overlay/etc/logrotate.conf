# Rotate log files daily
daily

# Keep 7 days worth of backlogs
rotate 5

# Create new (empty) log files after rotating old ones
create

# Use date as a suffix for rotated logs
dateext

# Compress rotated log files
compress

# Do not rotate empty log files
notifempty

# Do not issue an error if the log file is missing
missingok

# Run postrotate script only once for all logs being rotated
sharedscripts

# Include additional configurations from /etc/logrotate.d/
include /etc/logrotate.d

/var/log/syslog /var/log/ignite_messages {
    size 1M
    daily
    missingok
    rotate 5
    compress
    delaycompress
    notifempty
    create 0640 root adm
    sharedscripts
    postrotate
        # Reload syslog-ng to start writing to a new log file
        systemctl reload syslog-ng > /dev/null 2>&1 || true
    endscript
}
